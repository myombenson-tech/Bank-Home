<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="NiceSignup.css">
</head>
<body>
    <center>
    <div id="container">
        <h3 align="center">Create Account</h3>
        <form>
            <fieldset>
                <legend>Enter Details</legend>
                <div id="input-field">
                    <label for="user-name">Username:</label><br>
                    <input type="text" id="username" placeholder="Enter Username" required><br>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" placeholder="Enter e-mail" required><br>
                    <label for="password">Password:</label><br>
                    <input type="password" id="password" placeholder="Enter Password" required><br>
                    <label for="confirm-password">Confirm Password:</label><br>
                    <input type="password" id="confirm-password" placeholder="Re-type Password" required><br>
                    <div id="signup-login">
                        <button>Sign Up</button><br>
                        <div class="link">
                            <span id="login">Already have an account?</span>
                            <a href="NiceLogin.html">Login</a>
                        </div>
                    </div>
                </div>
            </fieldset><hr>
            <center><span id="courage">By: Courage</span></center>
        </form>
    </div>
    </center>
</body>
</html>
