<!-- HTML -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="NiceLogin.css">
</head>
<body>
    <center>
    <div id="login-container" align="center">
        <h3 align="center">Welcome Back</h3>
        <div>
            <form>
                <fieldset>
                    <legend>Enter Details</legend>
                <div id="input-field">
                    <label for="user-name">Username:</label><br>
                    <input type="text" id="username" placeholder="Enter Username" required><br>
                    <label for="password">Password:</label><br>
                    <input type="password" id="password" placeholder="Enter Password" required>
                    <div id="chechbox">
                        <input type="checkbox" value="Remember me">Remember me
                        <a style="float: right;" href="#">forgotten password?</a>
                    </div><br>
                    <div id="login-signup">
                        <button>Login</button>
                        <div class="link">
                            <span id="register">Don't have account?</span>
                            <a href="NiceSignup.html">Get One</a>
                        </div>
                    </div>
                </div>
                </fieldset><hr>
                <center><span id="courage">By: Courage</span></center>
            </form>
        </div>
    </div>
    </center>
</body>
</html>
